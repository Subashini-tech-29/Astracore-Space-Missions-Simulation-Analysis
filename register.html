<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ASTRACORE — Register</title>
<link rel="stylesheet" href="css/style.css">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
</head>
<body>
<div id="particles"></div>
<div class="auth-page">
  <div class="auth-card card p-6" style="border-color:rgba(0,128,255,0.2);box-shadow:inset 0 0 10px rgba(0,128,255,0.1),0 0 40px rgba(0,128,255,0.1);">
    <div class="auth-logo">
      <div class="auth-logo-icon"><i data-lucide="shield-check"></i></div>
      <div class="auth-title neon-text">REGISTER</div>
      <div class="auth-subtitle">Request Operator Clearance</div>
    </div>
    <form id="regForm" class="space-y-4">
      <div class="form-group">
        <label class="label">Operator ID</label>
        <input id="username" class="input" placeholder="Choose a username" autocomplete="off">
        <div id="usernameErr" class="error-msg" style="display:none">Username is required</div>
      </div>
      <div class="form-group">
        <label class="label">Email Address</label>
        <input id="email" type="email" class="input" placeholder="operator@astracore.mil">
        <div id="emailErr" class="error-msg" style="display:none">Valid email is required</div>
      </div>
      <div class="form-group">
        <label class="label">Access Code</label>
        <input id="password" type="password" class="input" placeholder="Min 6 characters">
        <div id="passwordErr" class="error-msg" style="display:none">Password must be at least 6 characters</div>
      </div>
      <button type="submit" id="submitBtn" class="btn btn-primary w-full" style="justify-content:center;margin-top:8px">
        <i data-lucide="user-plus"></i>
        REQUEST CLEARANCE
      </button>
    </form>
    <div class="auth-footer">
      Already registered? <a href="index.html">Return to gate</a>
    </div>
    <div class="auth-hint">
      <i data-lucide="shield-alert" style="width:14px;height:14px"></i>
      RESTRICTED ACCESS — AUTHORIZED PERSONNEL ONLY
    </div>
  </div>
</div>
<script>
(function(){
  const c=document.getElementById('particles');
  for(let i=0;i<60;i++){const p=document.createElement('div');p.className='particle';p.style.cssText=`left:${Math.random()*100}%;top:${Math.random()*100}%;animation-duration:${Math.random()*4+3}s;animation-delay:${Math.random()*4}s;`;c.appendChild(p);}
  lucide.createIcons();
  document.getElementById('regForm').addEventListener('submit',function(e){
    e.preventDefault();
    const u=document.getElementById('username').value.trim();
    const em=document.getElementById('email').value.trim();
    const p=document.getElementById('password').value;
    let valid=true;
    document.getElementById('usernameErr').style.display=u?'none':'block';if(!u)valid=false;
    document.getElementById('emailErr').style.display=(em&&em.includes('@'))?'none':'block';if(!em||!em.includes('@'))valid=false;
    document.getElementById('passwordErr').style.display=p.length>=6?'none':'block';if(p.length<6)valid=false;
    if(!valid)return;
    const btn=document.getElementById('submitBtn');btn.disabled=true;btn.textContent='PROCESSING...';
    setTimeout(()=>{
      localStorage.setItem('astracore_user',JSON.stringify({username:u,role:'user'}));
      window.location.href='dashboard.html';
    },1000);
  });
})();
</script>
</body>
</html>
